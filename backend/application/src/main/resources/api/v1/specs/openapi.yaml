openapi: 3.0.3
info:
  title: Report Constructor API
  version: 1.0.0
  description: |
    Report Constructor — turns a marketing-campaign Google Sheet into a generated
    Google Slides deck (campaign/tactic placeholder resolution, line-item matching,
    Claude-generated copy, native Sheets-linked charts). Migrated from the legacy
    PHP app onto the AI Digital locked stack.

    Contract-first: backend interfaces and frontend types are generated from this
    file. Schemas are versioned explicitly in their names (UserV1, SheetReadResultV1).
    Enums are standalone `<Noun>V1` `$ref` schemas. Every path key carries the
    literal `/api/v1/` prefix (the generator ignores `servers[].url`).

    Auth: Clerk SSO only — every operation requires a Bearer JWT validated against
    the Clerk JWKS. The backend reads identity from the `user_id` claim and email
    from the `email` claim. Sheet/line-item/placeholder endpoints are stateless per
    request (the client holds the 2-D sheet rows in wizard state and re-POSTs them);
    only report generation is persisted (an async job polled by id).
servers:
  - url: /api/v1
    description: V1 base path (DOCUMENTATION ONLY — the openapi-generator-maven-plugin
      does NOT prepend this to generated Spring routes. Path keys below carry the
      `/api/v1/` prefix verbatim. See canonical-openapi-rules.md → "/api/v1 prefix").

tags:
  - name: auth
    description: Authentication bootstrap (Clerk SSO)
  - name: DataSource
    description: Read a tab of a Google Sheet as the service account
  - name: LineItemMatching
    description: Auto-map media-plan tactics to BigQuery line-item IDs (rules engine)
  - name: Placeholders
    description: Compute the campaign placeholder→value map (dry-run; no Drive writes)
  - name: ReportJobs
    description: Persisted async Google Slides report generation jobs
  - name: System
    description: Build/version metadata for the running backend
  - name: Reports
    description: The signed-in user's own report history
  - name: Admin
    description: Admin-only team statistics and technical dashboard (email allow-list gated)

paths:
  /api/v1/auth/me:
    get:
      tags: [ auth ]
      operationId: getCurrentUser
      summary: Returns the authenticated user (Clerk SSO)
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Authenticated user payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV1"
              examples:
                demo:
                  value:
                    user_id: "user_123"
                    email: "demo-user@example.com"
                    full_name: "Demo User"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"

  /api/v1/sheets/read:
    post:
      tags: [ DataSource ]
      operationId: readSheet
      summary: Read one tab of a Google Sheet (A1:Z) as the service account
      description: |
        Reads a single tab (range `'<tab>'!A1:Z`, 26-column cap) and returns its
        raw 2-D rows plus a small preview and tab metadata. The service account must
        have read access to the spreadsheet (shared with it or link-readable). When
        the requested tab does not exist, returns 200 with `ok=false` and
        `error="tab_not_found"` so the client can apply its Estimates→Proposal fallback.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetReadRequestV1"
      responses:
        "200":
          description: Tab read result (check `ok`/`error` for per-tab outcome).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetReadResultV1"
        "400":
          $ref: "#/components/responses/BadRequestV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/sheets/summary:
    post:
      tags: [ DataSource ]
      operationId: readSheetSummary
      summary: Read back the per-tactic summary table from a generated report workbook
      description: |
        Reads the per-tactic summary table (anchored by its `Tactic name` header) off
        the generated workbook's first tab and returns each tactic's plan/fact figures
        (impressions and spend) as already-formatted strings. Used by the review step
        to show the numbers the sheet actually carries instead of re-deriving them on
        the client. The signed-in user must have read access to the workbook.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetSummaryRequestV1"
      responses:
        "200":
          description: Per-tactic summary rows read from the workbook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetSummaryResultV1"
        "400":
          $ref: "#/components/responses/BadRequestV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/google/status:
    get:
      tags: [ DataSource ]
      operationId: getGoogleConnectionStatus
      summary: Google connectivity for the signed-in user (service account + mock mode)
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Connection status for sheet read and deck generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleConnectionStatusV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"

  /api/v1/line-items/match:
    post:
      tags: [ LineItemMatching ]
      operationId: matchLineItems
      summary: Auto-map media-plan tactics to BigQuery line-item IDs (rules only)
      description: |
        Pure rules engine (no LLM). Extracts line-item IDs from the BQ rows
        (`Level 1 Naming` underscore-segment index 8, digit-only), groups IDs by
        channel, and accepts a tactic↔ID match only when the tactic's expected
        channel maps to exactly one ID. Unmatched tactics are left for manual
        drag-and-drop in the UI.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineItemMatchRequestV1"
      responses:
        "200":
          description: Match result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineItemMatchResultV1"
        "400":
          $ref: "#/components/responses/BadRequestV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/placeholders/preview:
    post:
      tags: [ Placeholders ]
      operationId: previewPlaceholders
      summary: Compute the campaign placeholder→value map (dry-run, no Drive writes)
      description: |
        Collects campaign/tactic metrics from the BQ rows, resolves the full
        placeholder catalog (precedence adj → sheet → auto/Claude), and groups the
        result into sections for the preview panel. Claude-derived fields are gated
        on `CLAUDE_ENABLED`; when disabled they fall back to manual/"—". Touches no
        Google Drive/Slides.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequestV1"
      responses:
        "200":
          description: Placeholder map grouped into sections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResultV1"
        "400":
          $ref: "#/components/responses/BadRequestV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/placeholders/date-range:
    post:
      tags: [ Placeholders ]
      operationId: detectDateRange
      summary: Detect the raw-data (Elevate "Basic" tab) delivery date range
      description: |
        Scans the raw-data delivery rows and returns the earliest/latest delivery
        date. The UI shows this window for the user to confirm or correct before
        generating the report; the confirmed window then gates which rows contribute
        and fills {{flight_dates}}. The media plan is never consulted for dates.
        Touches no Google Drive/Slides.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DateRangeRequestV1"
      responses:
        "200":
          description: Detected raw-data date range (fields null when none found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DateRangeResultV1"
        "400":
          $ref: "#/components/responses/BadRequestV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/report-jobs:
    post:
      tags: [ ReportJobs ]
      operationId: createReportJob
      summary: Enqueue an async Google Slides report-generation job
      description: |
        Persists a generation job (owner = the caller's Clerk `user_id`) and starts
        the 7-step pipeline in the background (clone template → fill → trim → charts →
        share with the caller's email). Returns the job id immediately; poll
        `GET /api/v1/report-jobs/{jobId}` for progress and the final deck URL.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequestV1"
      responses:
        "202":
          description: Job accepted and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportJobCreatedV1"
        "400":
          $ref: "#/components/responses/BadRequestV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/report-jobs/{jobId}:
    get:
      tags: [ ReportJobs ]
      operationId: getReportJob
      summary: Poll a report-generation job by id
      description: |
        Returns the current status/step/label and, when done, the generated deck
        URL and any non-fatal warnings. Authorized to the owner only; a job owned by
        another user returns 404.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            format: int64
          description: Job identifier returned by createReportJob.
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportJobV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "404":
          $ref: "#/components/responses/NotFoundV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/version:
    get:
      tags: [ System ]
      operationId: getVersion
      summary: Returns the git commit of the running backend build
      description: |
        Reads the build-time generated `git.properties` (git-commit-id-maven-plugin).
        Used by the frontend to show whether a deploy actually picked up the latest
        commit. Fields are "unknown" when the build was produced without git metadata
        (e.g. a checkout without a `.git` directory).
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Backend build version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionV1"
              examples:
                demo:
                  value:
                    commitId: "f476734"
                    commitTime: "2026-06-24T16:37:14+02:00"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"

  /api/v1/reports:
    get:
      tags: [ Reports ]
      operationId: listMyReports
      summary: List the signed-in user's own report jobs (newest first)
      description: |
        Returns every report job owned by the caller's Clerk `user_id`, newest first,
        for the "My reports" history screen. Never returns another user's reports.
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: The caller's report history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/admin/stats:
    get:
      tags: [ Admin ]
      operationId: getAdminStats
      summary: Team-wide report statistics and technical health (admin only)
      description: |
        Aggregates the `report_jobs` table across all users into totals, a per-user
        breakdown, counts by report type, and a 7-day volume series, plus technical
        health counters. Authorized ONLY when the caller's email is on the server
        `app.admin.emails` allow-list; everyone else gets 403.
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Aggregated admin dashboard payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/admin/failures:
    delete:
      tags: [ Admin ]
      operationId: clearAdminFailures
      summary: Clear every failure and warning (admin only)
      description: |
        Clears the whole failures list at once: every hard-failed job is deleted along with its
        Claude usage rows, and every report that shipped with warnings keeps its report but loses
        the warning flag. After this the failures list and the failed counter return to zero.
        Admin allow-list gated.
      security:
        - bearerAuth: [ ]
      responses:
        "204":
          description: Failures cleared.
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/admin/failures/{jobId}:
    delete:
      tags: [ Admin ]
      operationId: resolveAdminFailure
      summary: Clear one failure or warning by job id (admin only)
      description: |
        Clears a single failures row. A hard-failed job is deleted with its Claude usage rows; a
        report that shipped with warnings keeps its report and only loses the warning flag. Admin
        allow-list gated.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: Report-job id behind the failures row.
      responses:
        "204":
          description: Failure cleared.
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "404":
          $ref: "#/components/responses/NotFoundV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/admin/reports:
    get:
      tags: [ Admin ]
      operationId: listAllReports
      summary: List every user's report jobs, newest first (admin only)
      description: |
        Team-wide report history — the same rows as "My reports" but across all
        users, with the owner email/name on each row. Admin allow-list gated.
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: All report jobs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/admin/admins:
    get:
      tags: [ Admin ]
      operationId: listAdmins
      summary: List all admins — config (root) and UI-managed (admin only)
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: The current admins.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"
    post:
      tags: [ Admin ]
      operationId: addAdmin
      summary: Grant admin access to an email (admin only)
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminRequestV1"
      responses:
        "200":
          description: The updated admin list after the grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListV1"
        "400":
          $ref: "#/components/responses/BadRequestV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

  /api/v1/admin/admins/{email}:
    delete:
      tags: [ Admin ]
      operationId: removeAdmin
      summary: Revoke a UI-managed admin grant (admin only)
      description: |
        Revokes a managed admin. Config (root) admins from `app.admin.emails`
        cannot be removed here and return 400.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
          description: Email of the managed admin to revoke (URL-encoded).
      responses:
        "200":
          description: The updated admin list after the revoke.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListV1"
        "400":
          $ref: "#/components/responses/BadRequestV1"
        "401":
          $ref: "#/components/responses/UnauthorizedV1"
        "403":
          $ref: "#/components/responses/ForbiddenV1"
        "404":
          $ref: "#/components/responses/NotFoundV1"
        "500":
          $ref: "#/components/responses/InternalServerErrorV1"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedV1:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorV1"
          examples:
            missingToken:
              value: { code: "C005", message: "Authentication required", timestamp: "2026-05-24T10:00:00Z", correlationId: "abc-123" }
    ForbiddenV1:
      description: Authenticated but lacking permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorV1"
    BadRequestV1:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorV1"
    NotFoundV1:
      description: Resource not found (or not owned by the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorV1"
    InternalServerErrorV1:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorV1"

  schemas:
    # ── Identity & shared error (scaffold — keep verbatim) ──────────────────────
    UserV1:
      type: object
      required: [ user_id, email ]
      # Baseline payload carries identity plus a single server-computed admin flag.
      # `is_admin` is derived from the `app.admin.emails` allow-list and is the only
      # authorization signal the client may trust for showing the admin surface.
      properties:
        user_id: { type: string, description: "Clerk user id (sub/user_id claim)" }
        email: { type: string, format: email }
        full_name: { type: string }
        is_admin:
          type: boolean
          description: "True when the caller's email is on the server admin allow-list. Gates the Dashboard nav item and the /admin API."

    ApiErrorV1:
      type: object
      required: [ code, message, timestamp ]
      properties:
        code: { type: string, description: "Machine-readable error code" }
        message: { type: string, description: "Human-readable message" }
        timestamp: { type: string, format: date-time }
        correlationId: { type: string }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ValidationParameterV1" }

    ValidationParameterV1:
      type: object
      required: [ code, value ]
      properties:
        code: { type: string }
        value: { type: string }

    # ── Enums (standalone $ref schemas — never inline) ──────────────────────────
    SourceV1:
      type: string
      description: |
        Provenance of a resolved placeholder value. Note (legacy fidelity): many
        auto/Claude-derived values are tagged `adj` to match the legacy UI; only the
        geo summary and thoughts/strategic fields use `claude`. `ui` = the report-type
        value; `not_found` = unresolved.
      enum: [ adj, sheet, ui, claude, not_found ]

    ReportJobStatusV1:
      type: string
      description: Lifecycle of a report-generation job (mirrors the report_job_status dictionary table).
      enum: [ queued, running, done, error ]

    RateTypeV1:
      type: string
      description: |
        How a matched line item's cost is bought. CPM = cost per 1000 impressions,
        CPC = cost per click, CPV = cost per view. Chosen by the user per tactic while
        matching the media plan against Elevate raw data; drives which Plan Units
        figure (impressions/clicks/views) is computed from unitPrice and monthlyBudget.
      enum: [ CPM, CPC, CPV ]

    ReportTypeV1:
      type: string
      description: |
        Report type. Fills the single `{{report_type}}` placeholder in both cases.
        For EOM, per-tactic plan figures come from the rate/budget fields entered on
        each MappingEntryV1 during line-item matching rather than the Estimates tab,
        and `dateFilter` on GenerateRequestV1 doubles as the reporting month.
      enum: [ EOC, EOM ]

    GenerationTargetV1:
      type: string
      description: |
        Which artifact the generation job produces from the resolved placeholders.
        SLIDES clones the Google Slides deck template (default, "Generate Slides").
        SHEET clones the Google Sheets template and fills it ("Generate Sheet").
        SLIDES_FROM_SHEET clones the deck but fills it from a previously generated
        (and user-edited) Google Sheet named by sheetUrl, instead of the raw grids.
        The placeholder catalog and data pipeline are identical across them; only the
        final render step and the unused-tactic trimming differ. Omitted → SLIDES.
      enum: [ SLIDES, SHEET, SLIDES_FROM_SHEET ]

    DateFilterModeV1:
      type: string
      description: |
        How raw-data (BigQuery export) rows are date-filtered before aggregation
        and charting. ALL = include every date present in the raw data. RANGE =
        include only rows whose date falls within [start, end] inclusive.
        This is independent of the media-plan flight window, which only feeds
        the {{flight_dates}} placeholder.
      enum: [ ALL, RANGE ]

    DateFilterV1:
      type: object
      description: |
        User-selected date window applied to the raw-data rows for the report.
        When omitted the server defaults to ALL (every date in the raw data).
      required: [ mode ]
      properties:
        mode: { $ref: "#/components/schemas/DateFilterModeV1" }
        start:
          type: string
          format: date
          description: "First day to include (inclusive). Required when mode = RANGE; ignored when mode = ALL."
        end:
          type: string
          format: date
          description: "Last day to include (inclusive). Required when mode = RANGE; ignored when mode = ALL."

    DateRangeRequestV1:
      type: object
      description: |
        Raw-data rows to scan for the delivery date range shown to the user for
        confirmation before generation.
      required: [ adjRows ]
      properties:
        adjRows: { $ref: "#/components/schemas/Rows2DV1" }

    DateRangeResultV1:
      type: object
      description: |
        Inclusive min/max delivery date detected in the raw-data ("Basic" tab)
        rows. Both fields are null when no dated delivery rows are present.
      properties:
        start:
          type: string
          format: date
          nullable: true
          description: "Earliest delivery date found in the raw data, or null."
        end:
          type: string
          format: date
          nullable: true
          description: "Latest delivery date found in the raw data, or null."

    # ── DataSource ──────────────────────────────────────────────────────────────
    GoogleConnectionStatusV1:
      type: object
      required: [ connected, email, scopes, connectUrl, mockMode ]
      properties:
        connected: { type: boolean }
        email: { type: string }
        scopes:
          type: array
          items: { type: string }
        connectUrl: { type: string }
        mockMode: { type: boolean }

    SheetReadRequestV1:
      type: object
      required: [ url, tab ]
      properties:
        url: { type: string, description: "Full Google Sheets URL (the spreadsheet id is parsed out)." }
        tab: { type: string, description: "Exact tab name, e.g. Proposal, Audience&Inventory, Estimates, Geo, Basic." }

    SheetReadResultV1:
      type: object
      required: [ ok, tab, rows, cols, tabs, headers, preview, rawRows ]
      properties:
        ok: { type: boolean, description: "True when the tab was read; false with `error` set otherwise." }
        error: { type: string, description: "Error code when ok=false, e.g. tab_not_found." }
        sheetId: { type: string }
        title: { type: string, description: "Spreadsheet title." }
        tab: { type: string, description: "Tab that was read." }
        tabs:
          type: array
          description: All tab titles in the spreadsheet.
          items: { type: string }
        rows: { type: integer, format: int32 }
        cols: { type: integer, format: int32 }
        headers:
          type: array
          description: First row (header cells).
          items: { type: string }
        preview:
          type: array
          description: First few data rows for display.
          items:
            type: array
            items: { type: string }
        rawRows:
          type: array
          description: All rows of the tab (ragged-tolerant 2-D grid, A1:Z).
          items:
            type: array
            items: { type: string }

    SheetSummaryRequestV1:
      type: object
      description: |
        Request to read back the per-tactic summary table from a generated report
        workbook (the sheet produced by the `target=SHEET` job). Only the workbook
        URL is needed — the server reads the summary table off the workbook's first
        tab as the signed-in user.
      required: [ sheetUrl ]
      properties:
        sheetUrl:
          type: string
          description: "Full Google Sheets URL of the generated report workbook."

    SheetSummaryRowV1:
      type: object
      description: |
        One tactic's plan/fact figures as they appear in the generated workbook's
        summary table. Values are already-formatted display strings taken verbatim
        from the sheet; a field is null when that cell was never filled.
      properties:
        tactic: { type: string, nullable: true, description: "Tactic name." }
        unitPlan:
          type: string
          nullable: true
          description: "Planned main unit — impressions for CPM, clicks for CPC, completions for CPV."
        unitFact:
          type: string
          nullable: true
          description: "Delivered (fact) main unit, matching whichever unit unitPlan carries."
        spendPlan: { type: string, nullable: true, description: "Planned spend." }
        spendFact: { type: string, nullable: true, description: "Delivered (fact) spend." }

    SheetSummaryResultV1:
      type: object
      description: Per-tactic summary rows read back from the generated report workbook.
      required: [ rows ]
      properties:
        rows:
          type: array
          description: One entry per tactic, in the workbook's summary-table order.
          items: { $ref: "#/components/schemas/SheetSummaryRowV1" }

    # ── LineItemMatching ─────────────────────────────────────────────────────────
    LineItemMatchRequestV1:
      type: object
      required: [ bqRows, planRows ]
      properties:
        bqRows:
          type: array
          description: Rows of the Elevate/BigQuery-export tab (Basic).
          items:
            type: array
            items: { type: string }
        planRows:
          type: array
          description: Rows of the media-plan tab (Proposal).
          items:
            type: array
            items: { type: string }

    IdNamingV1:
      type: object
      required: [ naming, channel, tactic ]
      properties:
        naming: { type: string }
        channel: { type: string }
        tactic: { type: string }

    MappingEntryV1:
      type: object
      required: [ tacticNum, tacticName, autoMatched ]
      properties:
        tacticNum: { type: integer, format: int32 }
        tacticName: { type: string }
        lineItemId: { type: string, description: "Matched line-item id, or null when unmatched." }
        namingSample: { type: string, description: "Sample Level-1 naming for the matched id (display only)." }
        autoMatched: { type: boolean }
        expectedChannel: { type: string, description: "Channel that needs manual assignment (when ambiguous)." }
        rateType: { $ref: "#/components/schemas/RateTypeV1" }
        unitPrice:
          type: number
          description: "Final unit price entered by the user (cost per 1000 impressions/click/view, per rateType). EOM only."
        monthlyBudget:
          type: number
          description: "Monthly budget entered by the user for this tactic; prorated onto the reporting month. EOM only."

    BreakdownSelectionV1:
      type: object
      required: [ tacticNum ]
      description: |
        One tactic's Step-3 breakdown toggles. Lists the breakdown section ids the
        user turned ON for this tactic on the "Breakdowns per tactic" screen. On the
        generated Sheet's "Breakdowns" tab, every breakdown section NOT listed here is
        cleared (cells blanked in place — no rows deleted) so only the enabled sections
        remain for that tactic.
      properties:
        tacticNum: { type: integer, format: int32, description: "1-based tactic number this selection applies to." }
        breakdowns:
          type: array
          description: "Enabled breakdown section ids for this tactic (tp, ca, geo, aud, dev). Empty means none enabled — all sections cleared."
          items: { type: string }

    LineItemMatchResultV1:
      type: object
      required: [ mapping, uniqueIds, idNamings, channelToIds, warnings, autoMatched, autoMatchCount ]
      properties:
        mapping:
          type: array
          items: { $ref: "#/components/schemas/MappingEntryV1" }
        uniqueIds:
          type: array
          items: { type: string }
        idNamings:
          type: object
          description: line-item id → naming/channel/tactic.
          additionalProperties: { $ref: "#/components/schemas/IdNamingV1" }
        channelToIds:
          type: object
          description: channel (original case) → distinct ids.
          additionalProperties:
            type: array
            items: { type: string }
        warnings:
          type: array
          items: { type: string }
        autoMatched: { type: boolean, description: "True only when every entry auto-matched and mapping is non-empty." }
        autoMatchCount: { type: integer, format: int32 }

    # ── Placeholders ──────────────────────────────────────────────────────────────
    PreviewRequestV1:
      type: object
      required: [ brief, reportType ]
      properties:
        brief: { type: string }
        reportType: { $ref: "#/components/schemas/ReportTypeV1" }
        marketVolume:
          type: string
          description: |
            Maximum addressable audience volume entered in the UI (DV360 audience
            estimate). Free text; the server parses the number and renders it
            compact (e.g. 74k, 702k, 1.2M) into {{market volume}}.
        sheetRows: { $ref: "#/components/schemas/Rows2DV1" }
        adjRows: { $ref: "#/components/schemas/Rows2DV1" }
        audienceRows: { $ref: "#/components/schemas/Rows2DV1" }
        estimatesRows: { $ref: "#/components/schemas/Rows2DV1" }
        geoRows: { $ref: "#/components/schemas/Rows2DV1" }
        lineItemMapping:
          type: array
          items: { $ref: "#/components/schemas/MappingEntryV1" }
        dateFilter: { $ref: "#/components/schemas/DateFilterV1" }

    PlaceholderEntryV1:
      type: object
      required: [ key, label, value, source ]
      properties:
        key: { type: string, description: "Placeholder token, e.g. {{total imps}}." }
        label: { type: string, description: "Human label (Russian, verbatim)." }
        value: { type: string, description: "Resolved value, or — when unresolved." }
        source: { $ref: "#/components/schemas/SourceV1" }

    SectionV1:
      type: object
      required: [ title, placeholders ]
      properties:
        title: { type: string, description: "Section title (English, verbatim — Start, Overview, …)." }
        placeholders:
          type: array
          items: { $ref: "#/components/schemas/PlaceholderEntryV1" }

    LabelPairV1:
      type: object
      required: [ label, value ]
      properties:
        label: { type: string }
        value: { type: string }

    PreviewStatsV1:
      type: object
      required: [ found, total ]
      properties:
        found: { type: integer, format: int32 }
        total: { type: integer, format: int32 }

    PreviewResultV1:
      type: object
      required: [ sections, allLabels, stats, sheetCount, adjCount ]
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/SectionV1" }
        allLabels:
          type: object
          description: 'Source group ("sheet"/"adj") → label/value pairs found in that sheet.'
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/LabelPairV1" }
        stats: { $ref: "#/components/schemas/PreviewStatsV1" }
        sheetCount: { type: integer, format: int32 }
        adjCount: { type: integer, format: int32 }

    # ── ReportJobs ────────────────────────────────────────────────────────────────
    GenerateRequestV1:
      type: object
      required: [ brief, reportType, marketVolume ]
      properties:
        brief: { type: string }
        changeLog:
          type: string
          description: |
            Optional free-text log of mid-flight changes/optimizations applied to
            the campaign (budget shifts, audience weight changes, delayed launches).
            Written into the sheet's {{change log}} placeholder and fed to Claude as
            extra context so the narrative can attribute results to the actions taken.
        reportType: { $ref: "#/components/schemas/ReportTypeV1" }
        target:
          allOf:
            - $ref: "#/components/schemas/GenerationTargetV1"
          description: |
            Artifact to build. Optional; defaults to SLIDES so existing callers
            keep producing decks. Set SHEET for the "Generate Sheet" flow.
        marketVolume:
          type: string
          description: |
            Maximum addressable audience volume entered in the UI (DV360 audience
            estimate). Free text; the server parses the number and renders it
            compact (e.g. 74k, 702k, 1.2M) into {{market volume}}. Required by the
            UI for EOC reports; EOM reports have no market-volume slide and send it
            empty, so no minimum length is enforced here.
        sheetRows: { $ref: "#/components/schemas/Rows2DV1" }
        adjRows: { $ref: "#/components/schemas/Rows2DV1" }
        audienceRows: { $ref: "#/components/schemas/Rows2DV1" }
        estimatesRows: { $ref: "#/components/schemas/Rows2DV1" }
        geoRows: { $ref: "#/components/schemas/Rows2DV1" }
        lineItemMapping:
          type: array
          items: { $ref: "#/components/schemas/MappingEntryV1" }
        breakdownSelections:
          type: array
          description: |
            Per-tactic Step-3 breakdown toggle state. Used only for target=SHEET: the
            server clears every breakdown section on the "Breakdowns" tab that a tactic
            did NOT enable, leaving only the selected sections. Omit (null) to leave the
            Breakdowns tab untouched; an empty array clears all sections for all tactics.
          items: { $ref: "#/components/schemas/BreakdownSelectionV1" }
        estimateDaypartGender:
          type: boolean
          default: true
          description: |
            Whether Claude may estimate the per-tactic dayparting (weekdays /
            weekends peak windows) and gender split (male / female) when the
            source sheets carry no manual value. Optional; defaults to true so
            existing callers keep the AI estimate. When false the four tokens
            {{tactic N weekdays}}, {{tactic N weekends}}, {{tactic N male}} and
            {{tactic N female}} are always written as an em-dash "—": no AI call
            is made and any manual sheet value is ignored, because these metrics
            are not always tracked reliably on the DSP side and an estimate would
            be a prediction rather than a measured figure.
        bqSheetId:
          type: string
          description: |
            Spreadsheet id of the Elevate/BQ sheet. PRESENCE-GATE ONLY — gates the
            chart step; the server does NOT re-read it (BQ pivots read adjRows).
        dateFilter: { $ref: "#/components/schemas/DateFilterV1" }
        sheetUrl:
          type: string
          description: |
            URL of a previously generated (and user-edited) Google Sheet. Used only
            when target=SLIDES_FROM_SHEET, where the deck is filled from this sheet's
            values instead of the raw grids. Ignored for SLIDES and SHEET.
        mediaPlanUrl:
          type: string
          description: |
            URL of the Media Plan Google Sheet the user connected. Persisted for the
            admin history so reviewers can open the source data; not used by the engine.
        elevateUrl:
          type: string
          description: |
            URL of the Elevate row-data Google Sheet the user connected. Persisted for
            the admin history so reviewers can open the source data; not used by the engine.

    ReportJobCreatedV1:
      type: object
      required: [ jobId ]
      properties:
        jobId: { type: integer, format: int64 }

    ReportJobV1:
      type: object
      required: [ jobId, status, step, total, warnings ]
      properties:
        jobId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/ReportJobStatusV1" }
        step: { type: integer, format: int32 }
        total: { type: integer, format: int32, description: "Always 7." }
        label: { type: string, description: "Human progress label." }
        slideUrl: { type: string, description: "Generated artifact URL (Slides deck or Sheet, per target; set when status=done)." }
        warnings:
          type: array
          description: Non-fatal warnings (chart/share failures); the job still completes.
          items: { type: string }
        error: { type: string, description: "Error message when status=error." }

    # ── My reports (report history) ─────────────────────────────────────────────
    ReportListV1:
      type: object
      required: [ total, reports ]
      properties:
        total: { type: integer, format: int32, description: "Number of reports the caller owns." }
        reports:
          type: array
          items: { $ref: "#/components/schemas/ReportSummaryV1" }

    ReportSummaryV1:
      type: object
      required: [ jobId, status, title, createdAt, inputTokens, outputTokens, totalTokens, costUsd ]
      properties:
        jobId: { type: integer, format: int64 }
        type: { type: string, description: "Report type code (e.g. EOM/EOC), when known." }
        status: { $ref: "#/components/schemas/ReportJobStatusV1" }
        title: { type: string, description: "Human-friendly report name for the row." }
        createdAt: { type: string, format: date-time }
        slideUrl: { type: string, description: "Generated deck/artifact URL when the job is done." }
        sheetUrl: { type: string, description: "Source Google Sheet URL the report was built from, when available." }
        fileName: { type: string, description: "Human file name of the generated artifact (e.g. the pptx/deck name)." }
        mediaPlanUrl: { type: string, description: "Media Plan source sheet the user connected (admin all-reports view)." }
        elevateUrl: { type: string, description: "Elevate row-data source sheet the user connected (admin all-reports view)." }
        ownerEmail: { type: string, description: "Report owner email — populated only for the admin all-reports view." }
        ownerName: { type: string, description: "Report owner display name — populated only for the admin all-reports view." }
        inputTokens: { type: integer, format: int64, description: "Claude input tokens this report billed (plain + prompt cache); 0 when the run predates token accounting." }
        outputTokens: { type: integer, format: int64, description: "Claude output tokens this report billed; 0 when unrecorded." }
        totalTokens: { type: integer, format: int64, description: "Every Claude token this report billed; 0 when unrecorded." }
        costUsd: { type: number, format: double, description: "Estimated cost of this report's tokens in USD at configured list prices." }

    # ── Admin management (admins by email) ──────────────────────────────────────
    AdminSourceV1:
      type: string
      description: |
        Where an admin grant comes from. `config` = the server `app.admin.emails`
        allow-list (root admins, not removable via UI). `managed` = added through
        the admin UI (stored in the DB, removable).
      enum: [ config, managed ]

    AdminListV1:
      type: object
      required: [ admins ]
      properties:
        admins:
          type: array
          items: { $ref: "#/components/schemas/AdminEntryV1" }

    AdminEntryV1:
      type: object
      required: [ email, source, removable ]
      properties:
        email: { type: string }
        source: { $ref: "#/components/schemas/AdminSourceV1" }
        addedByEmail: { type: string, description: "Who granted this admin (managed entries only)." }
        createdAt: { type: string, format: date-time, description: "When the grant was created (managed entries only)." }
        removable: { type: boolean, description: "True when this grant can be revoked via the UI (managed only)." }

    AddAdminRequestV1:
      type: object
      required: [ email ]
      properties:
        email: { type: string, description: "Email to grant admin access to." }

    # ── Admin dashboard (team statistics + technical health) ────────────────────
    AdminStatsV1:
      type: object
      required: [ updatedAt, totals, byUser, byType, weekly, tokens, tokenWeekly, byLabel, failures ]
      properties:
        updatedAt: { type: string, format: date-time, description: "When the aggregation was computed." }
        totals: { $ref: "#/components/schemas/AdminTotalsV1" }
        byUser:
          type: array
          items: { $ref: "#/components/schemas/AdminUserStatV1" }
        byType:
          type: array
          items: { $ref: "#/components/schemas/AdminTypeStatV1" }
        weekly:
          type: array
          description: "Report volume for each of the last 7 days, oldest first."
          items: { $ref: "#/components/schemas/AdminDayVolumeV1" }
        tokens: { $ref: "#/components/schemas/AdminTokenTotalsV1" }
        tokenWeekly:
          type: array
          description: "Claude token spend for each of the last 7 days, oldest first."
          items: { $ref: "#/components/schemas/AdminTokenDayV1" }
        byLabel:
          type: array
          description: "Measured token spend per pipeline stage (batch tag), most expensive first."
          items: { $ref: "#/components/schemas/AdminTokenLabelV1" }
        failures:
          type: array
          description: "The most recent job issues — hard failures and degraded (warning) reports — newest first."
          items: { $ref: "#/components/schemas/AdminFailedJobV1" }

    AdminTotalsV1:
      type: object
      required: [ reportsTotal, thisMonth, activeUsers, running, failed ]
      properties:
        reportsTotal: { type: integer, format: int32, description: "All report jobs ever created." }
        thisMonth: { type: integer, format: int32, description: "Jobs created in the current calendar month." }
        activeUsers: { type: integer, format: int32, description: "Distinct users who created a report." }
        running: { type: integer, format: int32, description: "Jobs currently queued or running (technical)." }
        failed: { type: integer, format: int32, description: "Jobs that ended in error (technical)." }

    AdminUserStatV1:
      type: object
      required: [ email, name, total, thisMonth, inputTokens, outputTokens, cacheTokens, totalTokens, costUsd ]
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string, description: "Display name (falls back to the email local part)." }
        total: { type: integer, format: int32 }
        thisMonth: { type: integer, format: int32 }
        lastActivity: { type: string, format: date-time, description: "Timestamp of the user's most recent report." }
        inputTokens: { type: integer, format: int64, description: "Plain (uncached) Claude input tokens across the user's reports." }
        outputTokens: { type: integer, format: int64, description: "Claude output tokens across the user's reports." }
        cacheTokens: { type: integer, format: int64, description: "Prompt-cache write + read tokens across the user's reports." }
        totalTokens: { type: integer, format: int64, description: "Every Claude token across the user's reports." }
        costUsd: { type: number, format: double, description: "Estimated cost of the user's reports in USD at configured list prices." }

    AdminTypeStatV1:
      type: object
      required: [ type, count ]
      properties:
        type: { type: string, description: "Report type code (uppercased); 'OTHER' when unknown." }
        count: { type: integer, format: int32 }

    AdminDayVolumeV1:
      type: object
      required: [ date, label, count ]
      properties:
        date: { type: string, format: date }
        label: { type: string, description: "Short weekday label, e.g. 'Mon'." }
        count: { type: integer, format: int32 }

    # ── Claude token consumption (admin "Token consumption" tab) ────────────────
    AdminTokenTotalsV1:
      type: object
      description: |
        Team-wide Claude token consumption. Cache write/read tokens are reported apart from
        plain input because they are billed at different rates. Costs are estimates at the
        server's configured list prices, computed at read time. Averages are taken over
        `reportsWithUsage` only — reports generated before token accounting existed carry no
        counts and would otherwise drag the mean down.
      required:
        [ reportsWithUsage, claudeCalls, inputTokens, outputTokens, cacheWriteTokens, cacheReadTokens,
          totalTokens, costUsd, tokensThisMonth, costThisMonthUsd, avgTokensPerReport, avgInputPerReport,
          avgOutputPerReport, avgCostPerReportUsd, unknownCalls, estimatedTokens, estimatedCostUsd,
          unattributedCalls, unattributedTokens, unattributedCostUsd ]
      properties:
        reportsWithUsage: { type: integer, format: int32, description: "Reports that carry recorded token counts." }
        claudeCalls: { type: integer, format: int64, description: "Anthropic API calls those reports made." }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64, description: "Input tokens written into the prompt cache." }
        cacheReadTokens: { type: integer, format: int64, description: "Input tokens served from the prompt cache." }
        totalTokens: { type: integer, format: int64, description: "Every token above, summed." }
        costUsd: { type: number, format: double, description: "Estimated total cost in USD." }
        tokensThisMonth: { type: integer, format: int64 }
        costThisMonthUsd: { type: number, format: double }
        avgTokensPerReport: { type: integer, format: int64 }
        avgInputPerReport: { type: integer, format: int64, description: "Mean input-side tokens (plain + cache) per report." }
        avgOutputPerReport: { type: integer, format: int64 }
        avgCostPerReportUsd: { type: number, format: double }
        unknownCalls:
          type: integer
          format: int64
          description: "Calls that were billed but whose reply never arrived (timeout/dropped connection)."
        estimatedTokens:
          type: integer
          format: int64
          description: |
            Predicted tokens of those calls — prompt size measured locally before the request went out,
            output side predicted from what calls with the same batch tag actually returned. Deliberately
            NOT included in `totalTokens`, so the measured figure stays measured.
        estimatedCostUsd: { type: number, format: double, description: "Estimated cost of `estimatedTokens`." }
        unattributedCalls:
          type: integer
          format: int64
          description: "Measured calls belonging to no report, e.g. the line-item match run from a web request."
        unattributedTokens:
          type: integer
          format: int64
          description: "Measured tokens of those calls. Already included in `totalTokens`, excluded from the per-report averages."
        unattributedCostUsd: { type: number, format: double }

    AdminTokenLabelV1:
      type: object
      description: "Measured Claude spend for one pipeline stage, keyed by the batch tag its calls are logged under."
      required: [ label, calls, totalTokens, costUsd, unknownCalls ]
      properties:
        label: { type: string, description: "Batch tag, e.g. 'BatchC', 'BatchGeo', 'LineItemMatch'." }
        calls: { type: integer, format: int64 }
        totalTokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double }
        unknownCalls: { type: integer, format: int64, description: "Calls of this stage whose reply never arrived." }

    AdminTokenDayV1:
      type: object
      required: [ date, label, totalTokens, costUsd ]
      properties:
        date: { type: string, format: date }
        label: { type: string, description: "Short weekday label, e.g. 'Mon'." }
        totalTokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double }

    AdminFailedJobV1:
      type: object
      description: |
        One report-job issue: either a hard failure (the run threw and produced no report) or a
        degraded report (the run finished but a slide shipped without its Claude copy). `severity`
        tells the two apart. `step`/`stepLabel` are the last progress values the job reached, so for
        a hard failure they name the stage that threw and for a degraded report the final step.
      required: [ jobId, title, step, total, severity, errorMessage, warnings, totalTokens, costUsd ]
      properties:
        jobId: { type: integer, format: int64 }
        type: { type: string, description: "Report type code, when known." }
        title: { type: string, description: "Human-friendly report name." }
        slideUrl: { type: string, description: "Generated deck URL when the run produced one (degraded reports); absent for a hard failure." }
        ownerEmail: { type: string }
        ownerName: { type: string }
        createdAt: { type: string, format: date-time }
        failedAt: { type: string, format: date-time, description: "When the job was last updated, i.e. when it failed or finished." }
        step: { type: integer, format: int32, description: "1-based pipeline step the job had reached." }
        total: { type: integer, format: int32, description: "Number of steps in the pipeline." }
        stepLabel: { type: string, description: "Name of that step, e.g. 'Claude — executive batch (C)'." }
        severity:
          type: string
          description: "'error' for a hard failure that produced no report; 'warning' for a report that completed degraded."
        errorMessage: { type: string, description: "Failure message (hard failure) or a short summary (degraded report)." }
        warnings:
          type: array
          description: "Per-slide generation warnings for a degraded report; empty for a hard failure."
          items: { type: string }
        totalTokens: { type: integer, format: int64, description: "Tokens the run consumed." }
        costUsd: { type: number, format: double, description: "Estimated cost of those tokens in USD." }

    VersionV1:
      type: object
      required: [ commitId ]
      properties:
        commitId:
          type: string
          description: Short git commit hash of the running backend build (e.g. "f476734"), or "unknown".
        commitTime:
          type: string
          description: Commit timestamp (ISO-8601) of commitId, omitted when unavailable.

    # ── Shared building block ───────────────────────────────────────────────────
    Rows2DV1:
      type: array
      description: A ragged-tolerant 2-D grid of sheet cell strings (A1:Z).
      items:
        type: array
        items: { type: string }
