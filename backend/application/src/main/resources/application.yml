# Base application config. Profile-specific overrides:
#   - application-replit.yml  → Replit workspace + Reserved VM deploy
#   - application-local.yml   → docker-compose / local-dev
#
# REPLACE before use:
#   - server.servlet.context-path → /<app-name> ONLY if your deployment needs one
#     (a separate path-prefix beyond /api/v1/). Most Replit MVPs leave it empty.
#
# !!! DO NOT add `spring.security.oauth2.resourceserver.jwt.*` properties here !!!
# Spring Boot's OAuth2 auto-config triggers on ANY of those properties (even
# empty strings) and tries to fetch JWKS from the empty URL at startup.
# SecurityConfig provides the JwtDecoder bean directly; that's enough to
# satisfy the resource-server chain without poking auto-config.

spring:
  application:
    # Replace APP_SERVICE_NAME with the generated app's stable slug during
    # handoff (e.g. employee-directory). The fallback keeps the scaffold
    # runnable before the first project-specific rename.
    name: ${APP_SERVICE_NAME:reportconstructor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        query.in_clause_parameter_padding: true
        criteria.literal_handling_mode: bind
        default_batch_fetch_size: 300
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: ${PORT:8080}
  # Replit + Reserved VM terminate TLS at the edge and forward X-Forwarded-*
  # headers. `framework` makes Spring honour them so absolute URLs / Swagger /
  # CORS resolve to the public https origin rather than http://localhost:5000.
  forward-headers-strategy: framework
  servlet:
    # Default empty (root) — Spring serves /api/v1/... directly. Set a
    # path-prefix only when a deployment specifically needs one; if you
    # set it, also set APP_CONTEXT_PATH in docker-compose.yml so the
    # backend healthcheck and the frontend nginx /api proxy match.
    context-path: ${APP_CONTEXT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    url: /api/v1/specs/openapi.yaml

logging:
  level:
    root: INFO
    org.zalando.logbook: TRACE   # TRACE on the logbook logger → emit req/resp lines
    # DEBUG here dumps the full text of any Claude reply that failed to parse, so a section failure can be
    # diagnosed on a deployed run without widening every other logger.
    com.aidigital.reportconstructor.externalservices.anthropic: ${CLAUDE_LOG_LEVEL:INFO}

# App-specific config — these become AuthProperties / UsageLoggingProperties
# via @ConfigurationProperties("app.auth") and ("app.usage-logging").
app:
  auth:
    allowed-email-domain: ${AUTH_ALLOWED_EMAIL_DOMAIN:aidigital.com}
    publishable-key: ${CLERK_PUBLISHABLE_KEY:}
    # Comma-separated EXACT trusted browser origins for the JWT azp claim (required).
    # Never a publishable key. Blank values fail startup (AuthStartupValidator).
    authorized-parties: ${AUTH_AUTHORIZED_PARTIES:}
    # Clerk SSO is the ONLY auth mode. Issuer/JWKS derive from publishable-key
    # when AUTH_ISSUER_URI / AUTH_JWKS_URI are blank.
    sso:
      issuer-uri: ${AUTH_ISSUER_URI:}
      jwk-set-uri: ${AUTH_JWKS_URI:}
      audience: ${AUTH_AUDIENCE:}
  clerk:
    secret-key: ${CLERK_SECRET_KEY:}
    google-provider: ${CLERK_GOOGLE_PROVIDER:oauth_google}
  # Admin dashboard allow-list. Comma-separated emails granted the Dashboard
  # section and the /api/v1/admin/* API. Grant/revoke by editing APP_ADMIN_EMAILS
  # (or this default) and redeploying — there is no in-app role store.
  admin:
    emails: ${APP_ADMIN_EMAILS:alex.turner@aidigital.com}
  # Claude list prices in USD per million tokens, used only to turn the token counts
  # recorded on each report job into the dashboard's money column. Cost is computed at
  # read time, so correcting a rate here re-prices the whole history. Add a `by-model`
  # entry when the deployment's model changes and older jobs must keep their old price.
  claude-pricing:
    default-price:
      input-per-mtok: ${CLAUDE_PRICE_INPUT:3.00}
      output-per-mtok: ${CLAUDE_PRICE_OUTPUT:15.00}
      cache-write-per-mtok: ${CLAUDE_PRICE_CACHE_WRITE:3.75}
      cache-read-per-mtok: ${CLAUDE_PRICE_CACHE_READ:0.30}
    by-model:
      claude-haiku-4-5:
        input-per-mtok: 1.00
        output-per-mtok: 5.00
        cache-write-per-mtok: 1.25
        cache-read-per-mtok: 0.10
      claude-opus-4:
        input-per-mtok: 15.00
        output-per-mtok: 75.00
        cache-write-per-mtok: 18.75
        cache-read-per-mtok: 1.50
  security:
    cors:
      allowed-origins: "${APP_SECURITY_CORS_ALLOWED_ORIGINS:https://*.replit.dev,https://*.repl.co,http://localhost:5173,http://localhost:5000}"
      max-age-seconds: ${APP_SECURITY_CORS_MAX_AGE_SECONDS:3600}
    csp:
      frame-ancestors: "${APP_SECURITY_CSP_FRAME_ANCESTORS:'self' https://*.replit.dev https://*.repl.co}"
  # Logbook HTTP req/resp logging — bound by LogbookConfig. Defaults inline
  # in LogbookProperties mirror the canonical rules; override here per-app.
  # See observability/logbook-http-logging-rules.md.
  logbook:
    censored-replacement: XXX
    headers-to-censor: [ Authorization, Cookie, Set-Cookie, X-API-Key, AccessKey, Proxy-Authorization ]
    json-fields-to-censor: [ ".*password.*", ".*token.*", ".*secret.*", ".*key.*", ".*credential.*", ".*authorization.*", privateKey, clientSecret, serviceAccount ]
    excluded:
      "/**/actuator/**": [ GET ]
      "/**/swagger-ui/**": [ GET ]
      "/**/specs/**": [ GET ]
      "/health": [ GET ]
      "/**": [ OPTIONS ]
  usage-logging:
    enabled: ${USAGE_LOGGING_ENABLED:true}
    # service-name MUST be non-empty when enabled=true. Default falls back
    # to spring.application.name so a generated project doesn't silently
    # bind NoOpUsageLogger because of an unset env var (past sessions
    # spent hours wondering "why zero usage events?"). Override per-app via
    # USAGE_LOG_SERVICE_NAME env var with the real stable identifier
    # (e.g. `employee-directory`, NOT `replit-mvp-template`).
    service-name: ${USAGE_LOG_SERVICE_NAME:${spring.application.name}}
    environment: ${USAGE_LOG_ENVIRONMENT:dev}
    executor-core-pool-size: ${USAGE_LOG_EXECUTOR_CORE_POOL_SIZE:1}
    executor-max-pool-size: ${USAGE_LOG_EXECUTOR_MAX_POOL_SIZE:2}
    executor-queue-capacity: ${USAGE_LOG_EXECUTOR_QUEUE_CAPACITY:200}
    max-error-message-length: ${USAGE_LOG_MAX_ERROR_MESSAGE_LENGTH:500}
    max-user-agent-length: ${USAGE_LOG_MAX_USER_AGENT_LENGTH:500}

# External integrations — Real* beans activate when credentials are non-blank.
external:
  google:
    service-account-json: ${GOOGLE_SERVICE_ACCOUNT_JSON:}
    # AI Digital Slides template + object ids (same as the working POC). Cloning
    # an empty template id is what caused C000 "deck creation failed". Override
    # per-environment via env vars; the defaults keep generation working.
    slides-template-id: ${SLIDES_TEMPLATE_ID:11qzOC7mdbajjlrrVrC8Zv7W5P_SOHpgMV_eWSW56WI0}
    # EOM (Tier 1&2) deck template. Deliberately blank: EOM decks are built from the EOC template
    # (slides-template-id) above, minus the EOC-only story slides dropped below. Set a non-blank
    # EOM_SLIDES_TEMPLATE_ID to point EOM deck builds at a separate template instead.
    eom-slides-template-id: ${EOM_SLIDES_TEMPLATE_ID:}
    # Slides an EOM deck must never ship (RealSlidesProvider#deleteReportTypeSlides). The EOM deck is built
    # from the EOC template, so it carries these EOC-only story slides; they are deleted after the deck
    # is built. Only applied when reportType = EOM.
    #
    # Preferred: name them by object id — ids survive the Drive copy the deck is made from, so unlike a title
    # they cannot drift when the template's wording is edited. To collect an id, open the deck template
    # (11qzOC7…), click the slide, and copy the "#slide=id.XXXX" part of the address bar; paste it with or
    # without the "id." prefix. Ids configured but absent from the deck are skipped.
    # Ids read from a presentations.get dump of the EOC template (11qzOC7…). If EOM is ever pointed at its
    # own template again, a Drive copy keeps every object id — the same assumption tactic-slide-object-ids
    # above already relies on.
    eom-drop-slide-object-ids:
      - "g3ef28aa56c3_0_2486"   # THE FREQUENCY & VELOCITY PLAY
      - "g3ef28aa56c3_0_3106"   # AWARENESS & MARKET SHARE DOMINANCE
    # Fallback for slides not matched by id: matched on the slide's text, reduced to letters + digits, so
    # casing/spacing/punctuation don't matter — but "&" must stay "&" (an "and" spelling would not match).
    # Less robust than the ids: re-wording the slide in the template silently stops the match. Phrases must
    # be STATIC template text — this pass runs after the deck is filled, so a {{token}} is already gone.
    # The frequency slide is matched on its "DATA SIGNAL" heading rather than its title, because the title
    # is split across separate text boxes ("THE FREQUENCY" / "&" / "VELOCITY" / "PLAY") that do not
    # concatenate into the phrase; "DATA SIGNAL" is unique to that slide in the template.
    eom-drop-slide-titles:
      - "DATA SIGNAL"
      - "AWARENESS & MARKET SHARE DOMINANCE"
    slides-target-folder-id: ${SLIDES_TARGET_FOLDER_ID:}
    # Every generated file (deck AND EOC sheet) is auto-shared as a writer with
    # these emails, so an owner/admin keeps access even when a report is created
    # in another user's own My Drive. Comma-separated; override via
    # SLIDES_SHARE_WITH_EMAILS. Note: all admins (app.admin.emails + UI-managed
    # grants) are added on top of this list automatically — see DriveShareRecipients.
    share-with-emails: ${SLIDES_SHARE_WITH_EMAILS:alex.turner@aidigital.com}
    # Deck trim (RealSlidesProvider#trimTactics) works in groups of 7 tactics:
    # group 1 → tactics 1–7, group 2 → 8–14, group 3 → 15–21, group 4 → 22–28.
    # Each group slide carries BOTH its 7-tactic summary table and its
    # "Our results overview N" text, so the summary slide == the results slide;
    # empty groups are deleted via results-slide-object-ids and summary-slide-
    # object-ids stays empty. Object ids collected from the 28-tactic template
    # (presentations.get on 11qzOC7…). Missing ids are skipped at trim time.
    summary-table-object-ids:
      1: "p6_i4579"
      2: "g3f4b9ea3eb6_0_1"
      3: "g3f4b9ea3eb6_0_8"
      4: "g3f4b9ea3eb6_0_15"
    # Group slide carries both the summary table and the overview → the whole slide
    # is removed via results-slide-object-ids, so this stays empty.
    summary-slide-object-ids: {}
    results-slide-object-ids:
      1: "p6"
      2: "g3f4b9ea3eb6_0_0"
      3: "g3f4b9ea3eb6_0_7"
