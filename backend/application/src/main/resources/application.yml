    # Per-tactic breakdown master slides (SLIDES_FROM_SHEET flow). Keyed by BreakdownType
    # wire code. Each id is a single generic master slide whose tokens carry the literal
    # "n" tactic variable; for every enabled (tactic, breakdown) pair the master is
    # duplicated, its "n" tokens renumbered to the tactic number, and the copy placed after
    # that tactic's main slide. Masters are deleted at the end. Empty = feature disabled
    # (safe no-op). Ids collected via presentations.get on 11qzOC7… (slides 45-49, the
    # trailing master block) — same method used for tactic-slide-object-ids above.
    breakdown-master-slide-object-ids:
      tp: "g3f0a39e9ae9_0_2233"    # Top Publishers
      ca: "g3f0a39e9ae9_0_2371"    # Creative analysis
      geo: "g3f0a39e9ae9_0_2436"   # Geo performance
      aud: "g3f0a39e9ae9_0_2534"   # Audience analysis
      dev: "g3f0a39e9ae9_0_2623"   # Device breakdown
    # Master object id of the single generic "Thoughts on tactic performance" slide, whose tokens carry
    # the literal "n" tactic variable ({{thoughts on tactic n performance 1..4}}). Duplicated once per
    # tactic that enables MORE THAN TWO breakdown sections, placed right after that tactic's last breakdown
    # copy; the master is deleted at the end. Set directly (like breakdown-master-slide-object-ids above)
    # rather than gated behind an env var: the Step-3 thoughts pass writes all four tokens for every
    # qualifying tactic (blank on failure, never a raw token) and the slide is duplicated under the same
    # gate, so no raw {{…}} can survive. Id read via presentations.get on 11qzOC7… (slide holding the
    # four {{thoughts on tactic n performance 1..4}} tokens). Blank = feature disabled (safe no-op).
    thoughts-master-slide-object-id: "g3f56c270c23_0_0"
    # Per-tactic breakdown charts (SLIDES_FROM_SHEET flow). The audience and device master slides
    # each embed a chart linked to a shared source workbook; after a master is duplicated per tactic
    # its chart still points at that shared (empty) workbook, so we copy the workbook per tactic, write
    # the tactic's impressions into column B (share of voice stays a live formula in column C) and
    # relink the copy's chart. Keyed by BreakdownType wire code. source-sheet-ids = the template
    # workbook (with its embedded chart) to copy; chart-id-in-sheet = that workbook's embedded chart id
    # (from spreadsheets.get → sheets.charts.chartId). Empty = feature disabled (safe no-op).
    # Ids read from the live template (11qzOC7…) via presentations.get: the aud/dev master slides
    # (g3f0a39e9ae9_0_2534 / _2623) each embed a LINKED sheetsChart whose spreadsheetId + chartId are
    # below. source-sheet-ids are copied per tactic (the originals stay as templates); chart-id-in-sheet
    # is the chart inside each source workbook (both happen to share 1497669750).
    breakdown-charts:
      source-sheet-ids:
        aud: ${BREAKDOWN_AUD_SOURCE_SHEET_ID:1543w_xteLATFepVy3ynnaBn5gdGZp_8IolA0tRBqvkM}   # "EOC - age distribution"
        dev: ${BREAKDOWN_DEV_SOURCE_SHEET_ID:1X5QhoIHIyTH7vhhFSHZmkzzxjDjB0Y4c6xw_ENVB1cs}   # "EOC - device distribution"
      chart-id-in-sheet:
        aud: ${BREAKDOWN_AUD_CHART_ID:1497669750}
        dev: ${BREAKDOWN_DEV_CHART_ID:1497669750}
    # "Generate Sheet" flow: template workbook cloned + filled per placeholder.
    # Unused tactic slots (summary-table rows + "Main slide N" detail blocks) are
    # located by content (header labels / anchor cells) at trim time — see
    # RealSheetDeckProvider — so no per-slot range config is needed here.
    sheets-template-id: ${SHEETS_TEMPLATE_ID:1aRNqq-vxDZEgA75-rGQL04uGezGGIksB4fqEe21E8aU}
    # EOM sheet template, used by the "Generate Sheet" step of the two-step EOM flow. Falls back to
